name: MERN CI/CD
on:
  push:
    branches: 
      - backend

jobs:
  backend-ci:
    # disable worklow loop, starts only if push is made not by actions bot
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          ref: "backend"
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set short git commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./local_deploy/Dockerfile.back
          push: true
          tags: |
            shymauno/myrepo:node-lts-alpine3.22-backend-mern-crud-devops
            shymauno/myrepo:node-lts-alpine3.22-backend-mern-crud-devops-${{ env.COMMIT_SHORT_SHA }}
      - name: Update Docker Image name in Kubernetes deployment
        shell: bash
        run: |
          # update deployment
          sed -i "s|image: shymauno/myrepo:node-lts-alpine3.22-backend-mern-crud-devops|image: shymauno/myrepo:node-lts-alpine3.22-backend-mern-crud-devops-${{ env.COMMIT_SHORT_SHA }}|g" ./local_deploy/kuber\(k3s\)/backend-deployment.yaml
          
          # config Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # stage, commit and push
          git add ./local_deploy/kuber\(k3s\)/backend-deployment.yaml
          git commit -m "update image name for deploy with ${{ env.COMMIT_SHORT_SHA }}"
          git push origin backend
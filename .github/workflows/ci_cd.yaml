name: MERN CI/CD
on:
  push:
    branches: 
      - frontend

jobs:
  frontend-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          ref: "frontend"
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set short git commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./local_deploy/Dockerfile.front
          push: true
          tags: |
            shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops
            shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops-${{ env.COMMIT_SHORT_SHA }}
      - name: Update Docker Image name in Kubernetes deployment
        shell: bash
        run: |
          sed -i "s|image: shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops|image: shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops-${{ env.COMMIT_SHORT_SHA }}|g" ./local_deploy/kuber\(k3s\)/frontend-deployment.yaml
          git add ./local_deploy/kuber\(k3s\)/frontend-deployment.yaml
          git commit -m "update image name for deploy with ${{ env.COMMIT_SHORT_SHA }}"
          git push origin frontend
name: MERN CI/CD
on:
  push:
    branches: 
      - frontend

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set short git commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./local_deploy/Dockerfile.front
          push: true
          tags: |
            shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops
            shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops-${{ env.COMMIT_SHORT_SHA }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: shymauno/myrepo:nginx-1.28.2-alpine3.23-frontend-mern-crud-devops
        ports:
        - containerPort: 80
          name: frontend-app-port
        resources:
          requests:
            memory: "256Mi"
            cpu: "256Mi"
        volumeMounts:
          name: config-map-nginx
          mountPath: /etc/nginx/conf.d/
      volumes:
        name: config-map-nginx
        configMap:
          name: config-nginx
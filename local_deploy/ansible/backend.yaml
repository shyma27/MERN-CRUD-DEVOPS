---
- name: Backend Server setup
  hosts: app_server
  remote_user: vagrant
  become: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - build-essential
        state: present
        update_cache: true

    - name: Add NodeSource GPG key
      ansible.builtin.apt_key:
        url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        state: present

    - name: Add NodeSource repository for Node.js {{ node_version }}
      ansible.builtin.apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }}.x nodistro main"
        state: present
        filename: nodesource

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Verify Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_ver
      changed_when: false

    - name: Display installed Node.js version
      ansible.builtin.debug:
        msg: "Node.js {{ node_ver.stdout }} installed"

    - name: Install PM2 globally for process management
      community.general.npm:
        name: pm2
        global: true
        state: present